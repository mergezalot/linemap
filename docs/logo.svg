<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>linemap</title>
  <defs>
    <path id="green" d="M56 4 V48 A28 28 0 0 0 84 76 H124"/>
    <path id="blue" d="M44 4 V48 A40 40 0 0 0 84 88 H124"/>
  </defs>
  <!-- the neon theme's travelling arrows: one runs down each line in turn, magenta, blue, lime, then
       all rest 10 s before the next round (a run is 0.27 s, they start 0.3 s apart).
       Each is drawn at the origin pointing right and put on its line by a motion path; it waits
       hidden until its turn. Without motion paths, or with reduced motion, they stay hidden. -->
  <style>
    .arrow { fill: #fff; opacity: 0; }
    @supports (offset-path: path('M0,0')) {
      .arrow { offset-rotate: auto; animation: run 10.87s linear infinite backwards; }
      .a1 { offset-path: path('M72 4 V124'); }
      .a2 { offset-path: path('M56 4 V48 A28 28 0 0 0 84 76 H124'); animation-delay: 0.3s; }
      .a3 { offset-path: path('M44 4 V48 A40 40 0 0 0 84 88 H124'); animation-delay: 0.6s; }
    }
    .a3 { fill: #000; } /* white hardly shows on lime */
    @keyframes run {
      0% { offset-distance: 0%; opacity: 0; }
      0.33% { opacity: 0.95; }
      2.15% { opacity: 0.95; }
      2.48%, 100% { offset-distance: 100%; opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .arrow { animation: none; } }
  </style>
  <!-- orange runs under green and blue: they cut it, 4 px wider than themselves on each side -->
  <mask id="under" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
    <rect width="128" height="128" fill="#fff"/>
    <g fill="none" stroke="#000" stroke-width="20"><use href="#green"/><use href="#blue"/></g>
  </mask>
  <g fill="none" stroke-width="12">
    <g mask="url(#under)">
      <path d="M72 4 V124" stroke="#ff00d4"/>
      <polygon class="arrow a1" points="7,0 -7,-4.5 -7,4.5" stroke="none"/>
    </g>
    <use href="#green" stroke="#3d5afe"/>
    <polygon class="arrow a2" points="7,0 -7,-4.5 -7,4.5" stroke="none"/>
    <use href="#blue" stroke="#c6ff00"/>
    <polygon class="arrow a3" points="7,0 -7,-4.5 -7,4.5" stroke="none"/>
  </g>
</svg>
